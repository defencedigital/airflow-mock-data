name: Create Release on Zip Upload

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get zip filename
        id: zip
        run: echo "file=$(ls *.zip | head -1)" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: ${{ steps.zip.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Airflow DAG ZIP        # ← added directly here
        run: |
          curl -X POST "${{ secrets.AIRFLOW_API_URL }}/api/v2/dags/github_webhook_dag_zip/dagRuns" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AIRFLOW_API_TOKEN }}" \
            -d '{
              "logical_date": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
              "conf": {
                "action": "release_published",
                "release_name": "Release ${{ github.run_number }}",
                "release_tag": "release-${{ github.run_number }}",
                "repository": "${{ github.repository }}",
                "sender": "${{ github.actor }}",
                "release_url": "${{ steps.release.outputs.url }}"
              }
            }'
